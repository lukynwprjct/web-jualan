<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Luxky Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      /* Luxury Dark Theme Color System */
      --bg-primary: #080808;
      --bg-secondary: #111111;
      --burgundy: #5C0715;
      --accent-red: #D7263D;
      --text-primary: #FFFFFF;
      --text-secondary: #A1A1AA;
      --border: #252525;
      --shadow-glow: 0 0 40px rgba(92, 7, 21, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text-primary);
      background-color: var(--bg-primary);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Background with subtle burgundy glow */
    .welcome-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .bg-gradient {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 0%, rgba(92, 7, 21, 0.15) 0%, transparent 60%),
                  radial-gradient(circle at 80% 20%, rgba(215, 38, 61, 0.08) 0%, transparent 50%),
                  linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      animation: bgPulse 8s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% { opacity: 1; }
      100% { opacity: 0.8; }
    }

    .bg-glow {
      position: absolute;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(92, 7, 21, 0.1) 0%, transparent 60%);
      top: -20%;
      left: 20%;
      border-radius: 50%;
      animation: glowFloat 10s ease-in-out infinite alternate;
    }

    @keyframes glowFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 50px) scale(1.1); }
    }

    /* Main Container */
    .welcome-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      box-sizing: border-box;
    }

    /* Brand Section */
    .brand-section {
      text-align: center;
      margin-bottom: 60px;
      animation: fadeInDown 800ms ease forwards;
      opacity: 0;
    }

    .luxky-logo {
      font-family: 'Inter', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.15em;
      margin-bottom: 12px;
      position: relative;
    }

    .luxky-logo::after {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, var(--burgundy), var(--accent-red), var(--burgundy));
      border-radius: 2px;
    }

    .brand-subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* Welcome Content */
    .welcome-content {
      text-align: center;
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInUp 1000ms ease 300ms forwards;
      opacity: 0;
    }

    .welcome-heading {
      font-family: 'Inter', sans-serif;
      font-size: 3rem;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 24px;
      background: linear-gradient(180deg, #FFFFFF 0%, #F5F5F5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome-subheading {
      font-size: 1.1rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 40px;
    }

    /* Form Section */
    .welcome-form {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 450px;
      animation: fadeInUp 1000ms ease 500ms forwards;
      opacity: 0;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .form-input {
      width: 100%;
      padding: 16px 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      transition: all 300ms ease;
      outline: none;
      font-weight: 400;
    }

    .form-input::placeholder {
      color: #3d3d3d;
    }

    .form-input:focus {
      border-color: var(--accent-red);
      box-shadow: 0 0 0 4px rgba(215, 38, 61, 0.1);
      transform: translateY(-2px);
    }

    .form-input:hover {
      border-color: #333;
    }

    /* Submit Button */
    .btn-continue {
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--burgundy) 0%, #4a0611 100%);
      color: white;
      font-size: 1rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 300ms ease;
      position: relative;
      overflow: hidden;
    }

    .btn-continue::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 500ms ease;
    }

    .btn-continue:hover::before {
      left: 100%;
    }

    .btn-continue:hover {
      background: linear-gradient(135deg, var(--accent-red) 0%, var(--burgundy) 100%);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(215, 38, 61, 0.3);
    }

    .btn-continue:active {
      transform: translateY(-1px);
    }

    .btn-continue:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Error Message */
    .error-message {
      color: var(--accent-red);
      font-size: 0.85rem;
      text-align: center;
      min-height: 24px;
      margin-top: 15px;
      opacity: 0;
      transition: opacity 300ms ease;
    }

    .error-message.visible {
      opacity: 1;
    }

    /* Footer */
    .welcome-footer {
      margin-top: 80px;
      text-align: center;
      animation: fadeIn 1200ms ease 700ms forwards;
      opacity: 0;
    }

    .footer-text {
      font-size: 0.85rem;
      color: var(--text-secondary);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .footer-text span {
      color: var(--accent-red);
    }

    /* Change Identity Link */
    .change-identity {
      margin-top: 20px;
      display: none;
      animation: fadeIn 1200ms ease 900ms forwards;
      opacity: 0;
    }

    .change-identity a {
      color: var(--text-secondary);
      font-size: 0.85rem;
      text-decoration: underline;
      transition: color 300ms ease;
    }

    .change-identity a:hover {
      color: var(--accent-red);
    }

    /* Animations */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .luxky-logo {
        font-size: 2.5rem;
      }

      .welcome-heading {
        font-size: 2.25rem;
      }

      .welcome-subheading {
        font-size: 1rem;
      }

      .welcome-container {
        padding: 40px 20px;
      }

      .bg-glow {
        width: 80vw;
        height: 80vw;
        left: 10%;
      }
    }

    @media (max-width: 480px) {
      .luxky-logo {
        font-size: 2rem;
      }

      .welcome-heading {
        font-size: 1.75rem;
      }

      .welcome-form {
        gap: 18px;
      }

      .form-input {
        padding: 16px 20px;
      }

      .btn-continue {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <!-- Background -->
  <div class="welcome-background">
    <div class="bg-gradient"></div>
    <div class="bg-glow"></div>
  </div>

  <!-- Main Content -->
  <div class="welcome-container">
    <!-- Brand Section -->
    <div class="brand-section">
      <h1 class="luxky-logo">LUXKY STORE</h1>
      <p class="brand-subtitle">Luxury E-Commerce</p>
    </div>

    <!-- Welcome Section -->
    <div class="welcome-content">
      <h2 class="welcome-heading">Welcome to Luxky.</h2>

      <form class="welcome-form" id="welcomeForm">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input 
            type="text" 
            id="fullName" 
            class="form-input" 
            placeholder="Enter your full name"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="location">Your Location</label>
          <input 
            type="text" 
            id="location" 
            class="form-input" 
            placeholder="Enter your city or location"
            required
          >
        </div>

        <button type="submit" class="btn-continue" id="continueButton">
          CONTINUE →
        </button>

        <div class="error-message" id="errorMessage"></div>
      </form>

      <!-- Change Identity Option -->
      <div class="change-identity" id="changeIdentity">
        <a href="#" id="changeIdentityLink">Change Identity</a>
      </div>
    </div>

    <!-- Footer -->
    <div class="welcome-footer">
      <p class="footer-text">LUXKY STORE — <span>PREMIUM EXPERIENCE</span></p>
    </div>
  </div>

  <script>
    // DOM Elements
    const welcomeForm = document.getElementById('welcomeForm');
    const fullNameInput = document.getElementById('fullName');
    const locationInput = document.getElementById('location');
    const continueButton = document.getElementById('continueButton');
    const errorMessage = document.getElementById('errorMessage');
    const changeIdentity = document.getElementById('changeIdentity');
    const changeIdentityLink = document.getElementById('changeIdentityLink');

    // Supabase Configuration
    const supabaseUrl = 'https://retpbhcztvthymtluesu.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJldHBiaGN6dHZ0aHltdGx1ZXN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MDQxNzksImV4cCI6MjEwOTE4MDE3OX0.s-p7_Gz9oUfqQc5SQwiKqRg6ByTDhL9cRTssGZG-xo4';

    // Check if identity exists on page load
    document.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('luxky_fullName');
      const savedLocation = localStorage.getItem('luxky_location');

      if (savedName && savedLocation) {
        // Show change identity option
        changeIdentity.style.display = 'block';
        fullNameInput.value = savedName;
        locationInput.value = savedLocation;
      }
    });

    // Form Submission
    welcomeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fullName = fullNameInput.value.trim();
      const location = locationInput.value.trim();
      
      // Reset error
      errorMessage.classList.remove('visible');
      
      // Validation
      if (!fullName || !location) {
        errorMessage.textContent = 'Please fill in all fields';
        errorMessage.classList.add('visible');
        return;
      }

      // Show loading state
      continueButton.disabled = true;
      continueButton.style.opacity = '0.6';
      continueButton.textContent = 'PROCESSING...';

      try {
        // Save to localStorage (for quick access on client)
        localStorage.setItem('luxky_fullName', fullName);
        localStorage.setItem('luxky_location', location);

        // Save to Supabase
        const supabase = createClient(supabaseUrl, supabaseKey);
        
        const { data, error } = await supabase
          .from('user_identities')
          .insert([
            {
              nama: fullName,
              lokasi: location,
              sent_to_whatsapp: false
            }
          ]);

        if (error) {
          console.error('Supabase error:', error);
          console.error('Error details:', JSON.stringify(error, null, 2));
          console.error('Error code:', error.code);
          console.error('Error message:', error.message);
          console.error('Error details:', error.details);
          console.error('Error hint:', error.hint);
          
          errorMessage.textContent = `DB Error: ${error.message} (code: ${error.code})`;
          errorMessage.classList.add('visible');
          continueButton.disabled = false;
          continueButton.style.opacity = '1';
          continueButton.textContent = 'CONTINUE →';
          return;
        }

        // Redirect to admin dashboard after short delay
        setTimeout(() => {
          window.location.href = '/admin/dashboard';
        }, 800);

      } catch (error) {
        console.error('Unexpected error:', error);
        console.error('Error details:', JSON.stringify(error, null, 2));
        
        errorMessage.textContent = `Error: ${error.message || 'Unknown error'}`;
        errorMessage.classList.add('visible');
        
        continueButton.disabled = false;
        continueButton.style.opacity = '1';
        continueButton.textContent = 'CONTINUE →';
      }
    });

    // Change Identity Link
    changeIdentityLink.addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('luxky_fullName');
      localStorage.removeItem('luxky_location');
      fullNameInput.value = '';
      locationInput.value = '';
      changeIdentity.style.display = 'none';
      errorMessage.classList.remove('visible');
    });
  </script>
</body>
</html>
